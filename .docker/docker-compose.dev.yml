# Development Configuration
# Use: docker-compose -f docker-compose.dev.yml up
# Features: Bind mounts for live editing, helper containers, development tools
name: leantime_dev
services:
  leantime_db:
    image: mysql:8.4
    container_name: mysql_leantime_dev
    volumes:
      - db_data:/var/lib/mysql
    restart: unless-stopped
    env_file: ./.env.dev                                    # Development environment file
    networks:
      - leantime-net
    command: --character-set-server=UTF8MB4 --collation-server=UTF8MB4_unicode_ci --innodb-buffer-pool-size=256M --innodb-log-file-size=128M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 30s
      timeout: 10s
      retries: 3
    environment:
      - MYSQL_INITDB_SKIP_TZINFO=1

  leantime:
    # Build from local source instead of using pre-built image
    build:
      context: ../.
      dockerfile: .docker/Dockerfile
    container_name: leantime_dev
    restart: unless-stopped
    env_file: ./.env.dev                                    # Development environment file
    # Add security options
    security_opt:
      - no-new-privileges:true
    # Add capabilities
    cap_add:
      # - CAP_NET_BIND_SERVICE
      - CAP_CHOWN
      - CAP_SETGID
      - CAP_SETUID
    ports:
      - "${LEAN_PORT:-9090}:8080"
    networks:
      - leantime-net
    volumes:
      # Data persistence volumes
      - public_userfiles:/var/www/html/public/userfiles     # Volume to store public files, logo etc
      - userfiles:/var/www/html/userfiles                   # Original volume name for compatibility
      - logs:/var/www/html/storage/logs                     # Log storage
      
      # Development: Bind mounts for live editing
      - ../app/Plugins:/var/www/html/app/Plugins            # Plugin development - live editing
      - ../public/theme:/var/www/html/public/theme          # Theme development - live editing
      
      # Configuration persistence
      - ../config/custom.ini:/var/www/html/config/custom.ini:ro
    depends_on:
      leantime_db:
        condition: service_healthy

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared_leantime_dev
    env_file: ./.env.dev 
    command: tunnel --no-autoupdate run --url http://leantime:8080
    networks: [leantime-net]
    depends_on:
      - leantime
    restart: unless-stopped

  # Development helper container for volume permissions
  # Run via docker compose -f docker-compose.dev.yml --profile helper up -d
  mysql_helper:
    image: mysql:8.4
    command: chown -R mysql:mysql /var/lib/mysql
    volumes:
      - db_data:/var/lib/mysql
    user: root
    profiles: [ "helper" ]

volumes:
  db_data:
  userfiles:                                               # User file storage
  public_userfiles:                                        # Public file storage
  logs:                                                    # Application logs
  # Note: themes and plugins use bind mounts in development for live editing

networks:
  leantime-net:
    driver: bridge
