# Production Configuration
# Use: docker-compose -f docker-compose.prod.yml up
# Features: Named volumes for security, optimized for production stability
name: leantime_prod
services:
  leantime_db:
    image: mysql:8.4
    container_name: mysql_leantime_prod
    volumes:
      - db_data:/var/lib/mysql
    restart: always                                         # More aggressive restart policy for production
    env_file: ./.env.prod                                   # Production environment file
    networks:
      - leantime-net
    command: --character-set-server=UTF8MB4 --collation-server=UTF8MB4_unicode_ci --innodb-buffer-pool-size=256M --innodb-log-file-size=128M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 30s
      timeout: 10s
      retries: 3
    environment:
      - MYSQL_INITDB_SKIP_TZINFO=1

  leantime:
    # Build from local source instead of using pre-built image
    build:
      context: ../.
      dockerfile: .docker/Dockerfile
    container_name: leantime_prod
    restart: always                                         # More aggressive restart policy for production
    env_file: ./.env.prod                                   # Production environment file
    # Production security options
    security_opt:
      - no-new-privileges:true
    # Add capabilities
    cap_add:
      # - CAP_NET_BIND_SERVICE
      - CAP_CHOWN
      - CAP_SETGID
      - CAP_SETUID
    ports:
      - "${LEAN_PORT:-8080}:8080"
    networks:
      - leantime-net
    volumes:
      # Data persistence volumes
      - public_userfiles:/var/www/html/public/userfiles     # Volume to store public files, logo etc
      - userfiles:/var/www/html/userfiles                   # Original volume name for compatibility
      - logs:/var/www/html/storage/logs                     # Log storage
      
      # Production: Named volumes for user-uploaded content
      # If themes/plugins are built into image, these can be removed
      - plugins:/var/www/html/app/Plugins                   # Plugin storage (user-uploaded plugins)
      - themes:/var/www/html/public/theme                   # Theme storage (user-uploaded themes)
      
      # Configuration persistence
      - ../config/custom.ini:/var/www/html/config/custom.ini:ro
    depends_on:
      leantime_db:
        condition: service_healthy

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared_leantime_prod
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    networks: [leantime-net]
    depends_on:
      - leantime
    restart: always                                         # More aggressive restart policy for production

volumes:
  db_data:
  userfiles:                                               # User file storage
  public_userfiles:                                        # Public file storage
  plugins:                                                 # Plugin storage - managed by Docker
  logs:                                                    # Application logs
  themes:                                                  # Theme storage - managed by Docker

networks:
  leantime-net:
    driver: bridge
